<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EDEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="description" content="도쿄 맛집 216곳 — 「토요일의 도쿄」 채널 정리">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="도쿄 맛집">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>도쿄 맛집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<style>
  :root{
    color-scheme: light dark;
    --ground:#EDEEF1;
    --surface:#FFFFFF;
    --surface-2:#E2E5EA;
    --line:#CED3DB;
    --line-soft:#DFE3E9;
    --ink:#15181D;
    --ink-2:#474D57;
    --ink-3:#787F8A;
    --accent:#B23A2E;
    --accent-ink:#FFF4F2;
    --accent-soft:#F6E1DD;
    --good:#1C7248;
    --good-soft:#DCEFE4;
    --star:#C98A0B;
    --shadow:0 1px 2px rgba(20,24,30,.08), 0 6px 18px rgba(20,24,30,.06);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#111317;
      --surface:#1A1D22;
      --surface-2:#23272E;
      --line:#333942;
      --line-soft:#282D35;
      --ink:#ECEEF2;
      --ink-2:#AFB5BF;
      --ink-3:#7B828D;
      --accent:#F07F6E;
      --accent-ink:#2A0D08;
      --accent-soft:#3A1C18;
      --good:#4CC98A;
      --good-soft:#15301F;
      --star:#F2C14E;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ground:#111317;
    --surface:#1A1D22;
    --surface-2:#23272E;
    --line:#333942;
    --line-soft:#282D35;
    --ink:#ECEEF2;
    --ink-2:#AFB5BF;
    --ink-3:#7B828D;
    --accent:#F07F6E;
    --accent-ink:#2A0D08;
    --accent-soft:#3A1C18;
    --good:#4CC98A;
    --good-soft:#15301F;
    --star:#F2C14E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
  }
  :root[data-theme="light"]{color-scheme:light}

  html,body{height:100%}
  /* 앱 화면은 손가락으로 확대하지 않는다 (지도는 아래에서 따로 허용) */
  html,body{touch-action:pan-x pan-y}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box}
  html{-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer}
  input{font:inherit;color:inherit}
  a{color:inherit}
  img{max-width:100%}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  body.lock{overflow:hidden}

  .wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 40px;display:flex;flex-direction:column;gap:12px}

  /* ---- 상단 ---- */
  .top{
    position:sticky;top:0;z-index:20;
    background:var(--ground);
    margin-inline:-16px;padding-inline:16px;
    padding-top:calc(12px + env(safe-area-inset-top, 0px));
    padding-bottom:10px;
    border-bottom:1px solid var(--line-soft);
    display:flex;flex-direction:column;gap:10px;
  }
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-family:Oswald,"IBM Plex Sans KR",sans-serif;font-weight:700;font-size:21px;letter-spacing:.11em;line-height:1;min-width:0}
  .brand small{font-family:"IBM Plex Sans KR",sans-serif;font-size:12px;font-weight:500;letter-spacing:0;color:var(--ink-3);margin-left:8px}
  .icon-btn{
    border:1px solid var(--line);background:var(--surface);border-radius:999px;
    width:36px;height:30px;font-size:14px;line-height:1;display:grid;place-items:center;
    color:var(--ink-2);padding:0;flex:none;
  }
  .search{position:relative}
  .search input{
    width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;
    padding:8px 36px 8px 14px;font-size:15px;
  }
  .search input::placeholder{color:var(--ink-3)}
  .search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink-3);width:30px;height:30px;font-size:16px}

  .tabs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
  .tabs button{flex:1;border:0;background:transparent;padding:6px 4px;font-size:13px;font-weight:600;color:var(--ink-3);white-space:nowrap}
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
  .tabs .n{font-family:Oswald,sans-serif;font-weight:500;font-size:11.5px;margin-left:3px;opacity:.75}

  /* ---- 필터 바 ---- */
  .chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-block:1px 3px}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;border:1px solid var(--line);background:var(--surface);
    border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;
  }
  .chip .n{font-family:Oswald,sans-serif;font-size:11.5px;color:var(--ink-3);margin-left:4px}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground);font-weight:600}
  .chip[aria-pressed="true"] .n{color:var(--ground);opacity:.7}
  .fbar{display:flex;align-items:center;gap:7px;margin-inline:-16px;padding-inline:16px;min-width:0}
  .fbar .chips{flex:1;min-width:0;margin-right:-16px;padding-right:16px}
  .fbtn{flex:none;display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink)}
  .fbtn .n{font-family:Oswald,sans-serif;font-size:11.5px;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
  .fbtn .ico{width:15px;height:15px}
  .chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
  .chip.on::after{content:"✕";margin-left:6px;font-size:11px}
  .fhint{font-size:13px;color:var(--ink-3);white-space:nowrap}

  .rec{display:flex;flex-direction:column;gap:6px}
  .rec .seg{align-self:flex-start}
  .rec p{margin:0;font-size:12.5px;color:var(--ink-3)}

  /* ---- 필터 시트 ---- */
  .fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
  .flist h3,.fprice h3{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--ink-3);display:flex;justify-content:space-between}
  .flist h3 button{border:0;background:transparent;color:var(--accent);font-size:12px;font-weight:600;padding:0;letter-spacing:0}
  .frow{
    display:flex;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line-soft);background:transparent;
    padding:9px 2px;text-align:left;font-size:14px;color:var(--ink);line-height:1.3;
  }
  .frow .box{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
  .frow[aria-pressed="true"]{font-weight:600}
  .frow[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink);color:var(--ground)}
  .frow .t{flex:1;min-width:0;overflow-wrap:anywhere}
  .frow .n{flex:none;font-family:Oswald,sans-serif;font-size:12px;color:var(--ink-3)}
  .frow.zero{color:var(--ink-3)}
  .fprice .wrapchips{display:flex;flex-wrap:wrap;gap:7px}
  .ffoot{display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--line-soft)}
  .ffoot button{border-radius:10px;padding:12px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface)}
  .ffoot .go{background:var(--ink);border-color:var(--ink);color:var(--ground)}
  #fsheet .sheet-b{padding-bottom:16px}
  .sheet-h h2{margin:0;font-size:16px}

  .more{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-3)}
  .more b{font-family:Oswald,sans-serif;font-weight:600;color:var(--ink);font-size:15px;margin-right:2px}
  .linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0}

  .tools{display:flex;align-items:center;gap:8px}
  .seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
  .seg button{border:0;background:transparent;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:4px}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
  .near{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:4px}
  .near[aria-pressed="true"]{background:#1F6FEB;border-color:#1F6FEB;color:#fff}
  .near .ico,.seg .ico{width:14px;height:14px}
  .dist{color:#1F6FEB;font-weight:600}
  :root[data-theme="dark"] .dist{color:#6EA8FE}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .dist{color:#6EA8FE} }

  /* ---- 지도 ---- */
  /* z-index:0 으로 지도를 한 층에 가둔다 — Leaflet 내부 z-index(400~700)가
     페이지의 시트·스크림(40~41) 위로 올라오지 않게 */
  .mapbox{position:relative;z-index:0;margin-inline:-16px}
  #map{height:calc(100vh - 250px);height:calc(100dvh - 250px);min-height:360px;background:var(--surface-2);border-block:1px solid var(--line-soft)}
  .mapnote{font-size:12px;color:var(--ink-3);padding:6px 16px 0}
  .leaflet-container{font-family:inherit;touch-action:none}   /* 지도만 확대·회전 제스처 허용 */
  /* 어두운 화면: 지도 타일만 반전해 눈부심을 줄인다 */
  :root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)} }
  .leaflet-popup-content-wrapper{border-radius:10px;background:var(--surface);color:var(--ink)}
  .leaflet-popup-tip{background:var(--surface)}
  .leaflet-popup-content{margin:10px 12px;min-width:170px}
  .pop-n{font-weight:700;font-size:14.5px;line-height:1.3}
  .pop-m{font-size:12px;color:var(--ink-3);margin:2px 0 8px}
  .pop-b{display:flex;gap:6px}
  .pop-b > *{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12.5px;font-weight:600;text-decoration:none;background:var(--surface);color:var(--ink)}
  .pop-b > .pri{background:var(--ink);border-color:var(--ink);color:var(--ground)}
  .me-dot{width:16px;height:16px;border-radius:50%;background:#1F6FEB;border:3px solid #fff;box-shadow:0 0 0 6px rgba(31,111,235,.25)}

  /* ---- 목록 ---- */
  .group-h{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    margin:10px 2px -4px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ink-3);
  }
  .group-h span:last-child{letter-spacing:0;font-weight:500}
  .list{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card.done{opacity:.62}
  .card-main{display:flex;gap:12px;padding:12px 12px 10px;border:0;background:transparent;text-align:left;width:100%}
  .thumb{flex:none;align-self:flex-start;width:112px;height:63px;border-radius:6px;background:var(--surface-2);overflow:hidden;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .rank{position:absolute;left:4px;top:4px;background:var(--accent);color:var(--accent-ink);font-family:Oswald,sans-serif;font-size:11px;font-weight:600;border-radius:4px;padding:0 5px;line-height:17px}
  .thumb .noimg{display:grid;place-items:center;height:100%;font-size:24px;color:var(--ink-3)}
  .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
  .name{font-weight:700;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
  .jp{font-size:12px;color:var(--ink-3);line-height:1.3;overflow-wrap:anywhere}
  .meta{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:0 6px}
  .meta > span + span::before{content:"·";color:var(--ink-3);margin-right:6px}
  .meta .price{font-weight:600;color:var(--ink)}
  .sig{font-size:12.5px;color:var(--ink-3);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .actions{display:flex;border-top:1px solid var(--line-soft)}
  .actions > *{
    flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
    border:0;background:transparent;padding:9px 4px;font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:none;
  }
  .actions > * + *{border-left:1px solid var(--line-soft)}
  .actions .off{color:var(--line);pointer-events:none}
  .actions .star[aria-pressed="true"]{color:var(--star)}
  .actions .check[aria-pressed="true"]{color:var(--good)}
  .ico{width:16px;height:16px;flex:none}

  .empty{text-align:center;color:var(--ink-3);padding:40px 12px;font-size:14px}

  /* ---- 상세 시트 ---- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;transition:opacity .2s}
  .scrim.on{opacity:1}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:41;
    max-width:560px;margin:0 auto;max-height:92vh;max-height:92dvh;
    background:var(--surface);border-radius:16px 16px 0 0;
    display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;
  }
  .sheet.on{transform:none}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 8px 16px;border-bottom:1px solid var(--line-soft)}
  .sheet-h .grab{font-size:12px;color:var(--ink-3)}
  .sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(24px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:14px}
  .sheet-b > *{flex-shrink:0}
  .hero{border-radius:8px;overflow:hidden;background:var(--surface-2);position:relative;padding-top:56.25%}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .warn{font-size:12px;color:var(--ink-3);margin-top:-8px}
  .d-name{font-size:22px;font-weight:700;line-height:1.25;margin:0}
  .d-jp{font-size:14px;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
  .badges{display:flex;flex-wrap:wrap;gap:6px}
  .badge{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--ink-2)}
  .badge.pick{background:var(--accent-soft);color:var(--accent)}
  .bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bigbtn{
    display:flex;align-items:center;justify-content:center;gap:7px;
    border-radius:10px;padding:12px 8px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid var(--line);background:var(--surface);
  }
  .bigbtn.primary{background:var(--ink);border-color:var(--ink);color:var(--ground)}
  .bigbtn .ico{width:18px;height:18px}
  .togglebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;font-weight:600;font-size:14px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
  .tbtn.star[aria-pressed="true"]{border-color:var(--star);color:var(--star)}
  .tbtn.check[aria-pressed="true"]{border-color:var(--good);color:var(--good);background:var(--good-soft)}
  .sec h3{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .sec p{margin:0;font-size:14px;color:var(--ink-2)}
  .sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
  .sec li{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line-soft);color:var(--ink)}
  .sec li:last-child{border-bottom:0}
  .sec li.sub{color:var(--ink-2)}
  .addr{display:flex;align-items:flex-start;gap:8px}
  .addr span{flex:1;overflow-wrap:anywhere}
  .copy{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;font-size:12px;font-weight:600;padding:2px 10px;color:var(--ink-2)}
  .extlinks{display:flex;flex-wrap:wrap;gap:8px}
  .extlinks a{font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none;color:var(--ink-2)}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--ground);font-size:13px;font-weight:600;border-radius:999px;padding:8px 16px;box-shadow:var(--shadow)}

  .foot{margin-top:18px;text-align:center;font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px}
  .foot a{color:var(--ink-2)}
  .ver{font-family:Oswald,sans-serif;letter-spacing:.06em;margin:0}
  .upd{
    position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top, 0px));transform:translateX(-50%);z-index:50;
    border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;
    border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);white-space:nowrap;
  }
</style>
</head>
<body>
<button type="button" id="upd" class="upd" hidden>새 버전이 있어요 · 눌러서 새로고침</button>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">TOKYO EATS<small>도쿄 맛집</small></div>
      <button type="button" class="icon-btn" id="theme" aria-label="화면 테마 바꾸기">◐</button>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="가게·메뉴·일본어 검색" autocomplete="off" enterkeyhint="search">
      <button type="button" id="q-clear" aria-label="검색어 지우기" hidden>✕</button>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="보기">
      <button type="button" data-v="all">전체</button>
      <button type="button" data-v="pick">추천</button>
      <button type="button" data-v="fav">★ 찜<span class="n" id="n-fav"></span></button>
      <button type="button" data-v="done">✓ 가봄<span class="n" id="n-done"></span></button>
    </div>
  </header>

  <div class="rec" id="rec" hidden>
    <div class="seg" role="group" aria-label="추천 기준">
      <button type="button" data-rec="pop">인기순</button>
      <button type="button" data-rec="hotel">숙소 가까운 곳</button>
    </div>
    <p id="rec-note"></p>
  </div>

  <div class="fbar">
    <button type="button" class="fbtn" id="fopen" aria-haspopup="dialog"></button>
    <div class="chips" id="active"></div>
  </div>

  <div class="more">
    <span><b id="count">0</b>곳</span>
    <div class="tools">
      <button type="button" class="near" id="near" aria-pressed="false"></button>
      <div class="seg" role="group" aria-label="보기 방식">
        <button type="button" data-mode="list">목록</button>
        <button type="button" data-mode="map">지도</button>
      </div>
    </div>
  </div>

  <div class="mapbox" id="mapbox" hidden>
    <div id="map" role="region" aria-label="맛집 지도"></div>
    <p class="mapnote" id="mapnote"></p>
  </div>
  <main id="list" class="list" aria-live="polite"></main>

  <footer class="foot">
    <span>출처 · 유튜브 <a href="https://www.youtube.com/@saturdaytokyo" target="_blank" rel="noopener">「토요일의 도쿄」</a> 영상 설명란</span>
    <span>영업시간·휴무일은 가기 전에 구글맵으로 꼭 확인하세요.</span>
    <span>지도 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 기여자</span>
    <span>찜·가봄 표시는 이 기기에만 저장됩니다.</span>
    <p class="ver" id="ver"></p>
    <p class="ver">© Dongkyu Kim</p>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-name" hidden>
  <div class="sheet-h">
    <span class="grab" id="d-where"></span>
    <button type="button" class="icon-btn" data-close aria-label="닫기">✕</button>
  </div>
  <div class="sheet-b" id="d-body"></div>
</section>

<section class="sheet" id="fsheet" role="dialog" aria-modal="true" aria-labelledby="f-title" hidden>
  <div class="sheet-h">
    <h2 id="f-title">필터</h2>
    <button type="button" class="icon-btn" data-close aria-label="닫기">✕</button>
  </div>
  <div class="sheet-b" id="f-body"></div>
  <div class="ffoot">
    <button type="button" id="f-reset">초기화</button>
    <button type="button" class="go" id="f-go" data-close></button>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  var ICON = {
    map:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    play:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/></svg>',
    star:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z"/></svg>',
    starOn:'<svg class="ico" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z"/></svg>',
    check:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l4.5 4.5L19.5 7"/></svg>',
    locate:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
    filter:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>'
  };

  var PRICES = [
    { key:"p1", label:"~1,500엔", max:1500 },
    { key:"p2", label:"~3,000엔", max:3000 },
    { key:"p3", label:"~6,000엔", max:6000 },
    { key:"p4", label:"6,000엔+", max:Infinity },
    { key:"p0", label:"가격 모름", max:null }
  ];
  /* "1,500~3,000엔" · "990엔" · "780~1,180엔" · "12,000엔+" 에서 가장 큰 금액을 뽑는다 */
  function priceMax(p){
    var nums = String(p || "").match(/\d[\d,]*/g);
    if (!nums) return null;
    return Math.max.apply(null, nums.map(function(n){ return +n.replace(/,/g, ""); }));
  }
  var POP_TOP = 30;   /* 추천 · 인기순에 보여줄 개수 */

  /* ---- 저장 (실패해도 앱은 돈다) ---- */
  function load(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

  var DATA = null, byId = {};
  var fav = load("tf-fav", {}), done = load("tf-done", {});
  var st = load("tf-state2", { view:"all", mode:"list", rec:"pop", regions:[], genres:[], prices:[] });
  var q = "";
  var near = false, here = null;   /* 내 주변: 켜면 거리순. 위치는 저장하지 않는다 */

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function norm(s){ return String(s || "").toLowerCase().replace(/\s+/g, ""); }
  function has(arr, v){ return arr.indexOf(v) >= 0; }
  function toggleIn(arr, v){ var i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }

  /* 구글맵: 노트에 링크가 있으면 그것, 없으면 일본어 상호·주소로 검색 */
  function mapUrl(s){
    if (s.map) return s.map;
    var query = s.addr && s.addr.length ? (s.jp ? s.jp + " " : "") + s.addr[s.addr.length - 1] : (s.jp || s.name);
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
  }
  function fmtViews(n){
    if (n == null) return "";
    if (n >= 10000) return "조회수 " + (n / 10000).toFixed(n < 100000 ? 1 : 0).replace(/\.0$/, "") + "만";
    return "조회수 " + n.toLocaleString("ko-KR");
  }
  function distM(s){
    if (!here || s.lat == null) return Infinity;
    var R = 6371000, toR = Math.PI / 180;
    var dLat = (s.lat - here.lat) * toR, dLng = (s.lng - here.lng) * toR;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(here.lat * toR) * Math.cos(s.lat * toR) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function fmtDist(m){
    if (!isFinite(m)) return "";
    if (m < 1000) return Math.round(m / 10) * 10 + "m";
    return (m / 1000).toFixed(m < 10000 ? 1 : 0) + "km";
  }

  /* ---- 거르기 ---- */
  function baseSet(){
    var shops = DATA.shops;
    if (st.view === "fav") return shops.filter(function(s){ return fav[s.id]; });
    if (st.view === "done") return shops.filter(function(s){ return done[s.id]; });
    if (st.view === "pick"){
      if (st.rec === "hotel")
        return shops.filter(function(s){ return s.pick; }).sort(function(a, b){ return a.pick - b.pick; });
      return shops.filter(function(s){ return s.pop && s.pop <= POP_TOP; }).sort(function(a, b){ return a.pop - b.pop; });
    }
    return shops;
  }
  function rankOf(s){
    if (st.view !== "pick") return 0;
    return st.rec === "hotel" ? s.pick : s.pop;
  }
  function matchQ(s){
    if (!q) return true;
    var hay = norm([s.name, s.jp, s.kind, s.genre, s.region, (s.sig || []).join(" "), (s.menu || []).join(" "), (s.info || []).join(" "), s.desc].join(" "));
    return hay.indexOf(norm(q)) >= 0;
  }
  function priceKey(p){
    var n = priceMax(p);
    if (n == null) return "p0";
    for (var i = 0; i < PRICES.length; i++) if (PRICES[i].max != null && n <= PRICES[i].max) return PRICES[i].key;
    return "p4";
  }
  /* 같은 칸 안에서는 OR, 칸끼리는 AND. skip 은 그 칸의 개수를 셀 때 자기 조건을 빼기 위함 */
  function filtered(skip){
    return baseSet().filter(function(s){
      if (skip !== "region" && st.regions.length && !has(st.regions, s.region)) return false;
      if (skip !== "genre" && st.genres.length && !has(st.genres, s.genre || "기타")) return false;
      if (skip !== "price" && st.prices.length && !has(st.prices, priceKey(s.price))) return false;
      return matchQ(s);
    });
  }
  function nFilters(){ return st.regions.length + st.genres.length + st.prices.length; }
  function priceLabel(k){ for (var i = 0; i < PRICES.length; i++) if (PRICES[i].key === k) return PRICES[i].label; return k; }

  /* ---- 필터 바 ---- */
  function renderBar(){
    var n = nFilters();
    $("fopen").innerHTML = ICON.filter + "필터" + (n ? '<span class="n">' + n + '</span>' : "");
    var h = [];
    st.regions.forEach(function(v){ h.push('<button type="button" class="chip on" data-rm="regions" data-val="' + esc(v) + '" aria-label="' + esc(v) + ' 빼기">' + esc(v) + '</button>'); });
    st.genres.forEach(function(v){ h.push('<button type="button" class="chip on" data-rm="genres" data-val="' + esc(v) + '" aria-label="' + esc(v) + ' 빼기">' + esc(v) + '</button>'); });
    st.prices.forEach(function(v){ h.push('<button type="button" class="chip on" data-rm="prices" data-val="' + esc(v) + '" aria-label="' + esc(priceLabel(v)) + ' 빼기">' + esc(priceLabel(v)) + '</button>'); });
    $("active").innerHTML = h.length ? h.join("") : '<span class="fhint">지역 · 종류 · 가격대</span>';

    $("rec").hidden = st.view !== "pick";
    Array.prototype.forEach.call(document.querySelectorAll("[data-rec]"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-rec") === st.rec);
    });
    $("rec-note").textContent = st.rec === "hotel"
      ? "숙소(도미인 이케부쿠로)에서 전철 20분 안쪽이면서 영상 조회수가 높은 23곳"
      : "가게가 나온 유튜브 영상의 조회수 상위 " + POP_TOP + "곳 · 한 영상에 여러 곳이 나오면 같은 조회수";
  }

  /* ---- 필터 시트 ---- */
  function renderFilterSheet(){
    var inR = filtered("region"), rc = {};
    inR.forEach(function(s){ rc[s.region] = (rc[s.region] || 0) + 1; });
    var inG = filtered("genre"), gc = {};
    inG.forEach(function(s){ var g = s.genre || "기타"; gc[g] = (gc[g] || 0) + 1; });
    var inP = filtered("price"), pc = {};
    inP.forEach(function(s){ var k = priceKey(s.price); pc[k] = (pc[k] || 0) + 1; });

    function row(field, val, label, n){
      var on = has(st[field], val);
      return '<button type="button" class="frow' + (n ? "" : " zero") + '" data-f="' + field + '" data-val="' + esc(val) + '" aria-pressed="' + on + '">' +
        '<span class="box">✓</span><span class="t">' + esc(label) + '</span><span class="n">' + (n || 0) + '</span></button>';
    }
    /* 누를 때 줄이 움직이지 않게 순서는 고정 — 지역·종류 모두 전체 가게 수가 많은 순, 기타는 맨 뒤 */
    var regions = DATA.regions.map(function(r){ return r.name; });
    var total = {};
    DATA.shops.forEach(function(s){ var g = s.genre || "기타"; total[g] = (total[g] || 0) + 1; });
    var genres = Object.keys(total).sort(function(a, b){
      if (a === "기타") return 1; if (b === "기타") return -1;
      return total[b] - total[a] || a.localeCompare(b, "ko");
    });

    $("f-body").innerHTML =
      '<div class="fcols">' +
        '<div class="flist"><h3><span>지역</span>' + (st.regions.length ? '<button type="button" data-clear="regions">해제</button>' : "") + '</h3>' +
          regions.map(function(r){ return row("regions", r, r, rc[r]); }).join("") + '</div>' +
        '<div class="flist"><h3><span>종류</span>' + (st.genres.length ? '<button type="button" data-clear="genres">해제</button>' : "") + '</h3>' +
          genres.map(function(g){ return row("genres", g, g, gc[g]); }).join("") + '</div>' +
      '</div>' +
      '<div class="fprice"><h3><span>가격대</span></h3><div class="wrapchips">' +
        PRICES.map(function(p){
          return '<button type="button" class="chip" data-f="prices" data-val="' + p.key + '" aria-pressed="' + has(st.prices, p.key) + '">' +
            esc(p.label) + '<span class="n">' + (pc[p.key] || 0) + '</span></button>';
        }).join("") +
      '</div></div>';
    $("f-go").textContent = filtered().length + "곳 보기";
  }

  /* ---- 목록 ---- */
  function card(s){
    var meta = [];
    if (s.kind) meta.push('<span>' + esc(s.kind) + '</span>');
    if (s.price && s.price !== "?") meta.push('<span class="price">' + esc(s.price) + '</span>');
    meta.push('<span>' + esc(s.region) + '</span>');
    if (near && here && s.lat != null) meta.push('<span class="dist">' + fmtDist(distM(s)) + '</span>');
    else if (st.view === "pick" && st.rec === "pop" && s.views != null) meta.push('<span>' + fmtViews(s.views) + '</span>');
    var thumb = s.thumb
      ? '<img src="./thumbs/' + encodeURIComponent(s.thumb) + '" alt="" loading="lazy" decoding="async">'
      : '<div class="noimg">🍽</div>';
    var r = rankOf(s);
    var rank = r ? '<span class="rank">' + r + '</span>' : "";
    var sig = (s.sig && s.sig.length) ? s.sig.join(" · ") : (s.desc || "");
    return '<article class="card' + (done[s.id] ? " done" : "") + '">' +
      '<button type="button" class="card-main" data-open="' + s.id + '">' +
        '<div class="thumb">' + thumb + rank + '</div>' +
        '<div class="info">' +
          '<div class="name">' + esc(s.name) + '</div>' +
          (s.jp ? '<div class="jp">' + esc(s.jp) + '</div>' : "") +
          '<div class="meta">' + meta.join("") + '</div>' +
          (sig ? '<div class="sig">' + esc(sig) + '</div>' : "") +
        '</div>' +
      '</button>' +
      '<div class="actions">' +
        '<a href="' + esc(mapUrl(s)) + '" target="_blank" rel="noopener">' + ICON.map + (s.event ? '지도' : s.chain ? '매장 찾기' : '구글맵') + '</a>' +
        (s.video ? '<a href="' + esc(s.video) + '" target="_blank" rel="noopener">' + ICON.play + '영상</a>'
                 : '<span class="off">' + ICON.play + '영상</span>') +
        '<button type="button" class="star" data-fav="' + s.id + '" aria-pressed="' + !!fav[s.id] + '" aria-label="찜">' + (fav[s.id] ? ICON.starOn : ICON.star) + '</button>' +
        '<button type="button" class="check" data-done="' + s.id + '" aria-pressed="' + !!done[s.id] + '" aria-label="가봄">' + ICON.check + '</button>' +
      '</div>' +
    '</article>';
  }

  function listItems(){
    var items = filtered();
    if (near && here) items = items.slice().sort(function(a, b){ return distM(a) - distM(b); });
    return items;
  }

  function renderList(items){
    if (!items.length){
      var msg = st.view === "fav" ? "아직 찜한 곳이 없어요. 카드의 ☆ 를 눌러보세요."
              : st.view === "done" ? "아직 가본 곳이 없어요. 다녀오면 ✓ 를 눌러두세요."
              : "조건에 맞는 곳이 없어요.";
      var wide = st.view !== "all" && (q || nFilters())
        ? '<br><button type="button" class="linkbtn" data-v="all">전체에서 찾아보기</button>' : "";
      $("list").innerHTML = '<p class="empty">' + msg + wide + '</p>';
      return;
    }
    /* 추천·거리순·지역 1개 선택이면 그대로, 아니면 지역별로 묶는다 */
    if (st.view === "pick" || (near && here) || st.regions.length === 1){
      $("list").innerHTML = items.map(card).join("");
      return;
    }
    var html = [];
    DATA.regions.forEach(function(r){
      var g = items.filter(function(s){ return s.region === r.name; });
      if (!g.length) return;
      html.push('<h2 class="group-h"><span>' + esc(r.name) + '</span><span>' + g.length + '곳</span></h2>');
      html.push(g.map(card).join(""));
    });
    $("list").innerHTML = html.join("");
  }

  function renderTabs(){
    Array.prototype.forEach.call($("tabs").querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-v") === st.view);
    });
    var nf = Object.keys(fav).length, nd = Object.keys(done).length;
    $("n-fav").textContent = nf ? nf : "";
    $("n-done").textContent = nd ? nd : "";
  }

  function renderTools(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-mode") === st.mode);
    });
    $("near").setAttribute("aria-pressed", near);
    $("near").innerHTML = ICON.locate + (near && !here ? "찾는 중…" : "내 주변");
    var isMap = st.mode === "map";
    $("mapbox").hidden = !isMap;
    $("list").hidden = isMap;
  }

  function render(){
    save("tf-state2", st);
    renderTabs();
    renderBar();
    renderTools();
    var items = listItems();
    $("count").textContent = items.length;
    if (st.mode === "map") renderMap(items); else renderList(items);
    if (openSheetId === "fsheet") renderFilterSheet();
  }

  /* ---- 지도 (Leaflet + OpenStreetMap 타일) ---- */
  var map = null, layer = null, meMarker = null, lastFit = "";
  function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function popupHtml(s){
    var m = [s.kind, s.price && s.price !== "?" ? s.price : "", s.region].filter(Boolean);
    if (near && here) m.push(fmtDist(distM(s)));
    return '<div class="pop-n">' + (fav[s.id] ? "★ " : "") + esc(s.name) + '</div>' +
      '<div class="pop-m">' + esc(m.join(" · ")) + '</div>' +
      '<div class="pop-b"><button type="button" class="pri" data-open="' + s.id + '">자세히</button>' +
      '<a href="' + esc(mapUrl(s)) + '" target="_blank" rel="noopener">구글맵</a></div>';
  }
  function renderMap(items){
    if (!window.L){
      $("mapnote").textContent = "지도를 불러오는 중이에요. 인터넷 연결이 필요해요.";
      setTimeout(function(){ if (st.mode === "map" && window.L) render(); }, 600);
      return;
    }
    if (!map){
      map = L.map("map", { zoomControl:false }).setView([35.69, 139.72], 12);
      L.control.zoom({ position:"bottomright" }).addTo(map);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
      layer = L.layerGroup().addTo(map);
    }
    setTimeout(function(){ map.invalidateSize(); }, 0);

    var pts = [], none = 0, accent = cssVar("--accent"), star = cssVar("--star"), good = cssVar("--good");
    layer.clearLayers();
    items.forEach(function(s){
      if (s.lat == null){ none++; return; }
      var r = rankOf(s);
      var mk = r
        ? L.marker([s.lat, s.lng], { icon: L.divIcon({ className:"", iconSize:[22, 22], iconAnchor:[11, 11],
            html:'<div style="width:22px;height:22px;border-radius:50%;background:' + (done[s.id] ? good : fav[s.id] ? star : accent) +
                 ';color:#fff;border:2px solid #fff;font:600 11px/18px Oswald,sans-serif;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.35)">' + r + '</div>' }) })
        : L.circleMarker([s.lat, s.lng], { radius: fav[s.id] ? 9 : 7, weight:2, color:"#fff",
            fillColor: done[s.id] ? good : fav[s.id] ? star : accent, fillOpacity:.95 });
      mk.bindPopup(function(){ return popupHtml(s); }, { closeButton:false, autoPanPadding:[20, 60] });
      mk.addTo(layer);
      pts.push([s.lat, s.lng]);
    });
    $("mapnote").textContent = none ? "위치를 모르는 " + none + "곳(체인점 등)은 지도에 안 보여요. 목록에서 확인하세요." : "";

    if (meMarker){ meMarker.remove(); meMarker = null; }
    if (near && here){
      meMarker = L.marker([here.lat, here.lng], {
        icon: L.divIcon({ className:"", html:'<div class="me-dot"></div>', iconSize:[16, 16], iconAnchor:[8, 8] }),
        interactive:false, zIndexOffset:1000
      }).addTo(map);
    }

    /* 조건이 바뀌었을 때만 화면을 다시 맞춘다 (찜 누를 때마다 튀지 않게) */
    var key = [st.view, st.rec, st.regions, st.genres, st.prices, q, near && here ? "near" : ""].join("|");
    if (key === lastFit) return;
    lastFit = key;
    if (near && here){
      var close = items.filter(function(s){ return s.lat != null; }).slice(0, 8)
        .map(function(s){ return [s.lat, s.lng]; });
      close.push([here.lat, here.lng]);
      map.fitBounds(close, { padding:[40, 40], maxZoom:16 });
    } else if (pts.length){
      map.fitBounds(pts, { padding:[30, 30], maxZoom:16 });
    }
  }

  function locate(){
    if (!navigator.geolocation){ toast("이 기기에서는 위치를 쓸 수 없어요"); near = false; render(); return; }
    navigator.geolocation.getCurrentPosition(function(pos){
      here = { lat:pos.coords.latitude, lng:pos.coords.longitude };
      if (!near) return;
      lastFit = "";
      render();
    }, function(err){
      near = false; here = null;
      toast(err.code === 1 ? "위치 권한이 꺼져 있어요 — 설정에서 허용해 주세요" : "위치를 찾지 못했어요");
      render();
    }, { enableHighAccuracy:true, timeout:12000, maximumAge:60000 });
  }

  /* ---- 시트 (상세 · 필터) ---- */
  var openSheetId = null, openId = null, lastFocus = null;
  function sec(title, inner){ return '<div class="sec"><h3>' + title + '</h3>' + inner + '</div>'; }
  function li(arr, cls){ return '<ul>' + arr.map(function(x){ return '<li' + (cls ? ' class="' + cls + '"' : "") + '>' + esc(x) + '</li>'; }).join("") + '</ul>'; }

  function renderDetail(){
    var s = byId[openId]; if (!s) return;
    $("d-where").textContent = s.region + (near && here && s.lat != null ? " · 여기서 " + fmtDist(distM(s)) : "");
    var h = [];
    if (s.thumb) h.push('<div class="hero"><img src="./thumbs/' + encodeURIComponent(s.thumb) + '" alt=""></div>');
    if (s.multi > 1) h.push('<p class="warn">※ 이 영상에 ' + s.multi + '곳이 나와요 — 사진이 이 가게가 아닐 수 있어요</p>');
    h.push('<div><h2 class="d-name" id="d-name">' + esc(s.name) + '</h2>' + (s.jp ? '<div class="d-jp">' + esc(s.jp) + '</div>' : "") + '</div>');

    var b = [];
    if (s.pop && s.pop <= POP_TOP) b.push('<span class="badge pick">인기 ' + s.pop + '위</span>');
    if (s.pick) b.push('<span class="badge pick">숙소 근처 추천 ' + s.pick + '위</span>');
    if (s.kind) b.push('<span class="badge">' + esc(s.kind) + '</span>');
    if (s.price && s.price !== "?") b.push('<span class="badge">' + esc(s.price) + '</span>');
    if (s.views != null) b.push('<span class="badge">' + fmtViews(s.views) + '</span>');
    if (s.chain) b.push('<span class="badge">체인</span>');
    if (s.event) b.push('<span class="badge">가게 아님 · 이벤트</span>');
    if (b.length) h.push('<div class="badges">' + b.join("") + '</div>');

    h.push('<div class="bigbtns">' +
      '<a class="bigbtn primary" href="' + esc(mapUrl(s)) + '" target="_blank" rel="noopener">' + ICON.map + (s.event ? '지도' : s.chain ? '매장 찾기' : '구글맵') + '</a>' +
      (s.video ? '<a class="bigbtn" href="' + esc(s.video) + '" target="_blank" rel="noopener">' + ICON.play + '영상 보기</a>'
               : '<span class="bigbtn" style="opacity:.4">' + ICON.play + '영상 없음</span>') +
    '</div>');
    h.push('<div class="togglebtns">' +
      '<button type="button" class="tbtn star" data-fav="' + s.id + '" aria-pressed="' + !!fav[s.id] + '">' + (fav[s.id] ? ICON.starOn + "찜함" : ICON.star + "찜하기") + '</button>' +
      '<button type="button" class="tbtn check" data-done="' + s.id + '" aria-pressed="' + !!done[s.id] + '">' + ICON.check + (done[s.id] ? "가봤어요" : "가봤음 표시") + '</button>' +
    '</div>');

    if (s.vtitle) h.push(sec("영상", '<p>' + esc(s.vtitle) + '</p>'));
    if (s.desc) h.push(sec("소개", '<p>' + esc(s.desc) + '</p>'));
    if (s.sig && s.sig.length) h.push(sec("대표 메뉴", '<p>' + esc(s.sig.join(" · ")) + '</p>'));
    if (s.menu && s.menu.length) h.push(sec("메뉴", li(s.menu)));
    if (s.info && s.info.length) h.push(sec("더 알아둘 메뉴", li(s.info, "sub")));
    if (s.pricing && s.pricing.length) h.push(sec(s.event ? "기간" : "가격 · 판매 기간", li(s.pricing)));
    if (s.hours && s.hours.length) h.push(sec("영업시간", li(s.hours)));
    if (s.notes && s.notes.length) h.push(sec("메모", li(s.notes, "sub")));
    if (s.addr && s.addr.length){
      h.push(sec("주소", '<ul>' + s.addr.map(function(a, i){
        return '<li class="addr"><span>' + esc(a) + '</span><button type="button" class="copy" data-copy="' + i + '">복사</button></li>';
      }).join("") + '</ul>'));
    }
    if (s.links && s.links.length){
      h.push(sec("링크", '<div class="extlinks">' + s.links.map(function(l){
        return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>';
      }).join("") + '</div>'));
    }
    $("d-body").innerHTML = h.join("");
  }

  function openSheet(id){
    if (openSheetId) closeSheet(true, true);
    openSheetId = id;
    lastFocus = document.activeElement;
    var el = $(id);
    el.querySelector(".sheet-b").scrollTop = 0;
    $("scrim").hidden = false; el.hidden = false;
    document.body.classList.add("lock");
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      $("scrim").classList.add("on"); el.classList.add("on");
      var c = el.querySelector("[data-close]"); if (c) c.focus({ preventScroll:true });
    }); });
    try { history.pushState({ sheet:id }, ""); } catch(e){}
  }
  function closeSheet(fromPop, instant){
    if (!openSheetId) return;
    var el = $(openSheetId);
    openSheetId = null; openId = null;
    $("scrim").classList.remove("on"); el.classList.remove("on");
    document.body.classList.remove("lock");
    var hide = function(){ if (!openSheetId){ $("scrim").hidden = true; } if (!el.classList.contains("on")) el.hidden = true; };
    if (instant) hide(); else setTimeout(hide, 250);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll:true });
    if (!fromPop){ try { history.back(); } catch(e){} }
  }
  window.addEventListener("popstate", function(){ closeSheet(true); });

  var toastT;
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 1600);
  }
  function copyText(text){
    function fallback(){
      var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("주소를 복사했어요"); } catch(e){ toast("복사하지 못했어요"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("주소를 복사했어요"); }, fallback);
    } else fallback();
  }

  /* ---- 이벤트 ---- */
  function toggle(m, key, id){
    if (m[id]) delete m[id]; else m[id] = 1;
    save(key, m);
  }
  document.addEventListener("click", function(e){
    var t = e.target.closest ? e.target.closest("button") : null;
    if (!t) return;
    var v;
    if ((v = t.getAttribute("data-fav"))){ toggle(fav, "tf-fav", v); if (fav[v]) toast("찜했어요"); render(); if (openId) renderDetail(); return; }
    if ((v = t.getAttribute("data-done"))){ toggle(done, "tf-done", v); render(); if (openId) renderDetail(); return; }
    if ((v = t.getAttribute("data-open"))){ openId = v; renderDetail(); openSheet("sheet"); return; }
    if (t.hasAttribute("data-copy")){ var s = byId[openId]; if (s) copyText(s.addr[+t.getAttribute("data-copy")]); return; }
    if (t.hasAttribute("data-close")){ closeSheet(); return; }
    if ((v = t.getAttribute("data-f"))){ toggleIn(st[v], t.getAttribute("data-val")); render(); return; }
    if ((v = t.getAttribute("data-clear"))){ st[v] = []; render(); return; }
    if ((v = t.getAttribute("data-rm"))){ toggleIn(st[v], t.getAttribute("data-val")); render(); return; }
    if ((v = t.getAttribute("data-rec"))){ st.rec = v; render(); return; }
    if ((v = t.getAttribute("data-mode"))){ st.mode = v; render(); return; }
    if ((v = t.getAttribute("data-v"))){ if (st.view !== v){ st.view = v; } render(); window.scrollTo(0, 0); return; }
    if (t.id === "fopen"){ renderFilterSheet(); openSheet("fsheet"); return; }
    if (t.id === "f-reset"){ st.regions = []; st.genres = []; st.prices = []; render(); return; }
    if (t.id === "near"){
      near = !near;
      lastFit = "";
      render();
      if (near) locate();
      return;
    }
  });
  $("scrim").addEventListener("click", function(){ closeSheet(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeSheet(); });

  var qT;
  $("q").addEventListener("input", function(){
    $("q-clear").hidden = !this.value;
    clearTimeout(qT);
    var val = this.value;
    qT = setTimeout(function(){ q = val.trim(); render(); }, 120);
  });
  $("q").addEventListener("keydown", function(e){ if (e.key === "Enter") this.blur(); });
  $("q-clear").addEventListener("click", function(){ $("q").value = ""; this.hidden = true; q = ""; render(); $("q").focus(); });

  /* 테마: 자동 → 밝게 → 어둡게 */
  var theme = load("tf-theme", "");
  function applyTheme(){
    if (theme) document.documentElement.setAttribute("data-theme", theme);
    else document.documentElement.removeAttribute("data-theme");
    $("theme").textContent = theme === "light" ? "☀" : theme === "dark" ? "☾" : "◐";
  }
  applyTheme();
  $("theme").addEventListener("click", function(){
    theme = theme === "" ? "light" : theme === "light" ? "dark" : "";
    save("tf-theme", theme); applyTheme(); render();
    toast(theme === "light" ? "밝은 화면" : theme === "dark" ? "어두운 화면" : "기기 설정 따라가기");
  });

  /* ---- 데이터 ---- */
  fetch("./data.json")
    .then(function(r){ return r.json(); })
    .then(function(d){
      DATA = d;
      d.shops.forEach(function(s){ byId[s.id] = s; });
      /* 데이터가 바뀌어 없어진 가게의 찜은 정리 */
      [fav, done].forEach(function(m){ Object.keys(m).forEach(function(k){ if (!byId[k]) delete m[k]; }); });
      if (["all", "pick", "fav", "done"].indexOf(st.view) < 0) st.view = "all";
      if (["list", "map"].indexOf(st.mode) < 0) st.mode = "list";
      if (["pop", "hotel"].indexOf(st.rec) < 0) st.rec = "pop";
      ["regions", "genres", "prices"].forEach(function(k){ if (!Array.isArray(st[k])) st[k] = []; });
      $("ver").textContent = "v" + d.version + " · " + d.shops.length + "곳";
      render();
    })
    .catch(function(){
      $("list").innerHTML = '<p class="empty">목록을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어주세요.</p>';
    });
})();
</script>
<script>
  (function(){
    var CURRENT = "26.09.18-1029";
    var btn = document.getElementById("upd");
    var latest = null;

    /* 서버의 version.json 을 캐시 없이 읽어 화면 버전과 비교 */
    function check(){
      fetch("./version.json?t=" + Date.now(), { cache:"no-store" })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){
          if (j && j.version && j.version !== CURRENT){ latest = j.version; if (btn) btn.hidden = false; }
        })
        .catch(function(){});
    }

    /* 누르면: 오프라인 캐시 비우기 → 서비스 워커 갱신 → 새 주소로 다시 열기 */
    if (btn) btn.addEventListener("click", function(){
      btn.textContent = "업데이트 중…";
      var clear = window.caches
        ? caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })
        : Promise.resolve();
      var upd = ("serviceWorker" in navigator)
        ? navigator.serviceWorker.getRegistration().then(function(r){ return r ? r.update() : null; })
        : Promise.resolve();
      Promise.all([clear.catch(function(){}), upd.catch(function(){})]).then(function(){
        location.replace("./index.html?v=" + encodeURIComponent(latest || Date.now()));
      });
    });

    window.addEventListener("load", function(){
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function(){});
      check();
    });
    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible") check();
    });
  })();
</script>
</body>
